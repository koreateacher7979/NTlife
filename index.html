    <!-- 스크립트 로직 -->
    <script>
        // --- ★ Apps Script 연동 URL (배포 후 얻은 주소를 여기에 붙여넣으세요) ★ ---
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwCWmMvpRwM-i9MMJI9BXw6T7ywai-F_y_jDC3Ol_3nYcT7p_SG5hgOmeJE8Jkc26NG/exec'; 

        // --- 상태 변수 ---
        const SHEET_ID = '1ZbPazY46kzoGNB19Oq_JS51cFRYmY2qaN8IFz6Ypl_s';
        // 개선됨: 불안정한 csv 대신 확실하게 데이터 구조를 잡아주는 json 포맷 사용
        const URL_PREFIX = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=`;
        
        const INITIAL_MOCK_DATA = [
            { id: 1, child: '나윤', day: '월요일', startTime: '18:00', endTime: '21:00', title: '학교', subject: '야간자습', color: 'pink' },
            { id: 2, child: '태윤', day: '월요일', startTime: '19:00', endTime: '22:00', title: '봉국어', subject: '국어', color: 'blue' },
            { id: 3, child: '나윤', day: '화요일', startTime: '16:30', endTime: '19:00', title: '옥수학', subject: '수학', color: 'pink' },
            { id: 4, child: '태윤', day: '화요일', startTime: '18:00', endTime: '22:25', title: '학교', subject: '심야자습', color: 'blue' },
            { id: 5, child: '나윤', day: '수요일', startTime: '18:00', endTime: '21:00', title: '학교', subject: '야간자습', color: 'pink' },
            { id: 6, child: '태윤', day: '수요일', startTime: '19:00', endTime: '22:00', title: '봉국어', subject: '국어', color: 'blue' },
            { id: 7, child: '나윤', day: '목요일', startTime: '18:30', endTime: '20:40', title: '손샘', subject: '영어', color: 'pink' },
            { id: 8, child: '태윤', day: '목요일', startTime: '19:00', endTime: '22:00', title: '영어', subject: '일등', color: 'blue' },
            { id: 9, child: '나윤', day: '금요일', startTime: '16:30', endTime: '19:00', title: '옥수학', subject: '수학', color: 'pink' },
            { id: 10, child: '태윤', day: '금요일', startTime: '18:00', endTime: '22:25', title: '학교', subject: '심야자습', color: 'blue' },
            { id: 11, child: '태윤', day: '토요일', startTime: '09:30', endTime: '12:00', title: '수학', subject: '디오수', color: 'blue' },
            { id: 12, child: '나윤', day: '토요일', startTime: '13:00', endTime: '16:00', title: '수학', subject: '디오수', color: 'pink' },
            { id: 13, child: '태윤', day: '토요일', startTime: '15:30', endTime: '20:00', title: '옥수학', subject: '수학', color: 'blue' },
            { id: 14, child: '나윤', day: '일요일', startTime: '13:00', endTime: '15:30', title: '국어', subject: '인사이트', color: 'pink' },
            { id: 15, child: '태윤', day: '일요일', startTime: '19:00', endTime: '21:00', title: '영어', subject: '일등', color: 'blue' },
        ];
        const DAYS = ['월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'];

        let state = {
            schedules: [], 
            viewMode: '통합',
            searchTerm: '',
            isDarkMode: false,
            isSyncing: false,
            settings: { password: '1234', notice: '오늘 저녁은 다같이 외식합니다! 학원 끝나고 바로 집으로 오세요 😊' },
            isEditMode: false,
            editNotice: ''
        };

        // --- 요일 텍스트 유연하게 처리 (ex: "월", "월요일 ", "월요" 모두 "월요일"로 자동 인식) ---
        const normalizeDay = (d) => {
            if (!d) return '';
            const text = d.toString().trim();
            if (text.includes('월')) return '월요일';
            if (text.includes('화')) return '화요일';
            if (text.includes('수')) return '수요일';
            if (text.includes('목')) return '목요일';
            if (text.includes('금')) return '금요일';
            if (text.includes('토')) return '토요일';
            if (text.includes('일')) return '일요일';
            return '';
        };

        const getCurrentDayString = () => {
            const index = new Date().getDay();
            return index === 0 ? '일요일' : DAYS[index - 1];
        };

        // --- 구글 시트 JSON 추출 헬퍼 함수 ---
        const fetchJsonFromGviz = async (url) => {
            const res = await fetch(url);
            if (!res.ok) throw new Error('네트워크 응답 오류');
            const text = await res.text();
            
            // gviz 응답은 google.visualization.Query.setResponse({...}) 형태이므로 JSON만 정규식으로 추출
            const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
            if (match && match[1]) {
                const json = JSON.parse(match[1]);
                if (json.status === 'error') throw new Error(json.errors[0].message);
                return json.table;
            }
            throw new Error('올바르지 않은 데이터 형식');
        };

        // --- 렌더링 함수 ---
        const renderHeaderAuthButton = () => {
            const container = document.getElementById('auth-btn-container');
            if (state.isEditMode) {
                container.innerHTML = `
                    <button id="btn-edit-done" class="flex items-center gap-1.5 px-3 py-2 sm:px-4 sm:py-2 rounded-xl text-sm font-semibold bg-green-500 text-white hover:bg-green-600 shadow-md whitespace-nowrap transition-all">
                        <i data-lucide="unlock" class="w-4 h-4"></i> 편집 완료
                    </button>
                `;
                document.getElementById('btn-edit-done').addEventListener('click', () => {
                    state.isEditMode = false;
                    renderApp();
                });
            } else {
                container.innerHTML = `
                    <button id="btn-auth-open" class="flex items-center gap-1.5 px-3 py-2 sm:px-4 sm:py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 shadow-md whitespace-nowrap transition-all">
                        <i data-lucide="lock" class="w-4 h-4"></i> 부모 인증 (편집)
                    </button>
                `;
                document.getElementById('btn-auth-open').addEventListener('click', () => {
                    document.getElementById('auth-modal').classList.remove('hidden');
                    document.getElementById('password-input').focus();
                });
            }
        };

        const renderMarquee = () => {
            const container = document.getElementById('marquee-container');
            if (state.isEditMode) {
                container.className = "rounded-3xl p-5 shadow-sm border-2 border-indigo-400 ring-4 ring-indigo-100 bg-white dark:bg-slate-800 transition-all";
                container.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-sm flex items-center gap-2">
                            <i data-lucide="megaphone" class="text-indigo-500 w-4 h-4"></i> 부모님 전달사항
                        </h3>
                        <span class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-bold">편집 중</span>
                    </div>
                    <div class="flex flex-col gap-3">
                        <textarea id="notice-textarea" class="w-full text-sm p-3 border border-slate-200 rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-400 outline-none resize-none h-24 dark:bg-slate-700 dark:border-slate-600 dark:text-white" placeholder="아이들에게 전달할 메시지를 입력하세요."></textarea>
                        
                        <div class="flex gap-2">
                            <button id="btn-delete-notice" class="flex-1 bg-red-50 text-red-600 text-sm font-bold py-2 rounded-xl border border-red-100 hover:bg-red-100 flex items-center justify-center gap-1 transition-all dark:bg-red-900/20 dark:border-red-900/50 dark:text-red-400 dark:hover:bg-red-900/40">
                                <i data-lucide="trash-2" class="w-4 h-4"></i> 지우기
                            </button>
                            <button id="btn-save-notice" class="flex-[2] bg-indigo-600 text-white text-sm font-bold py-2 rounded-xl hover:bg-indigo-700 flex items-center justify-center gap-1 disabled:opacity-70 disabled:cursor-not-allowed transition-all">
                                <i data-lucide="check" class="w-4 h-4"></i> 저장하기
                            </button>
                        </div>
                    </div>
                `;
                document.getElementById('notice-textarea').value = state.editNotice;
                document.getElementById('notice-textarea').addEventListener('input', (e) => state.editNotice = e.target.value);
                
                // 내용 지우기 버튼 (삭제)
                document.getElementById('btn-delete-notice').addEventListener('click', () => {
                    document.getElementById('notice-textarea').value = '';
                    state.editNotice = '';
                });

                // 구글 앱스 스크립트로 저장 요청 보내기
                document.getElementById('btn-save-notice').addEventListener('click', async () => {
                    const newNotice = state.editNotice;
                    const btn = document.getElementById('btn-save-notice');
                    const originalBtnHtml = btn.innerHTML;
                    
                    if (GAS_WEB_APP_URL === '여기에_배포된_웹앱_URL을_입력하세요' || !GAS_WEB_APP_URL) {
                        alert('구글 앱스 스크립트 웹앱 URL이 설정되지 않았습니다. 현재 화면에만 임시로 반영됩니다.');
                        state.settings.notice = newNotice;
                        state.isEditMode = false;
                        renderApp();
                        return;
                    }

                    btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 저장 중...`;
                    btn.disabled = true;
                    lucide.createIcons();

                    try {
                        const formData = new URLSearchParams();
                        formData.append('action', 'updateNotice');
                        formData.append('notice', newNotice);
                        formData.append('password', state.settings.password);

                        const response = await fetch(GAS_WEB_APP_URL, {
                            method: 'POST',
                            body: formData
                        });
                        const result = await response.json();

                        if (result.result === 'success') {
                            state.settings.notice = newNotice;
                            state.isEditMode = false;
                            alert('전달사항이 구글 시트에 성공적으로 저장되었습니다!');
                            renderApp();
                        } else {
                            alert('저장 실패: ' + result.message);
                            btn.innerHTML = originalBtnHtml;
                            btn.disabled = false;
                            lucide.createIcons();
                        }
                    } catch (error) {
                        console.error(error);
                        alert('네트워크 오류가 발생하여 저장하지 못했습니다.');
                        btn.innerHTML = originalBtnHtml;
                        btn.disabled = false;
                        lucide.createIcons();
                    }
                });
            } else {
                container.className = "rounded-3xl p-5 shadow-sm border-2 border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800 transition-all";
                container.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-sm flex items-center gap-2">
                            <i data-lucide="megaphone" class="text-indigo-500 w-4 h-4"></i> 부모님 전달사항
                        </h3>
                    </div>
                    <div class="bg-amber-50 border border-amber-100 rounded-xl p-3 h-16 flex items-center marquee-container overflow-hidden dark:bg-amber-900/20 dark:border-amber-900/50">
                        <p class="text-amber-800 font-semibold text-sm sm:text-base marquee-content whitespace-nowrap dark:text-amber-200">
                            ${state.settings.notice || "오늘의 전달사항이 없습니다."}
                        </p>
                    </div>
                `;
            }
        };

        const generateChildBadge = (child, color) => {
            const colorClass = color === 'pink' 
                ? 'bg-pink-100 text-pink-600 dark:bg-pink-900/50 dark:text-pink-300' 
                : 'bg-blue-100 text-blue-600 dark:bg-blue-900/50 dark:text-blue-300';
            return `<span class="px-2 py-0.5 rounded-full text-xs font-bold ${colorClass}">${child}</span>`;
        };

        const renderToday = () => {
            const todayStr = getCurrentDayString();
            const todaySchedules = state.schedules
                .filter(s => s.day === todayStr)
                .sort((a, b) => a.startTime.localeCompare(b.startTime));

            document.getElementById('today-count').textContent = `${todaySchedules.length}개`;
            
            const container = document.getElementById('today-schedules');
            if (todaySchedules.length > 0) {
                container.innerHTML = todaySchedules.map(schedule => {
                    const bgClass = schedule.color === 'pink'
                        ? 'bg-pink-50/50 border-pink-100 dark:bg-pink-900/20 dark:border-pink-800/50'
                        : 'bg-blue-50/50 border-blue-100 dark:bg-blue-900/20 dark:border-blue-800/50';
                    const textClass = schedule.color === 'pink' ? 'text-pink-600 dark:text-pink-400' : 'text-blue-600 dark:text-blue-400';

                    return `
                        <div class="p-4 rounded-2xl border flex flex-col gap-2 transition-transform hover:scale-[1.02] ${bgClass}">
                            <div class="flex justify-between items-center">
                                <span class="text-sm font-bold flex items-center gap-1.5 ${textClass}">
                                    ${schedule.startTime} <span class="text-slate-300 dark:text-slate-600 text-xs">→</span> ${schedule.endTime}
                                </span>
                                ${generateChildBadge(schedule.child, schedule.color)}
                            </div>
                            <div>
                                <h4 class="text-lg font-black">${schedule.title}</h4>
                                <p class="text-xs font-bold mt-1 flex items-center gap-1 text-slate-500 dark:text-slate-400">
                                    <span class="text-[10px]">📚</span> ${schedule.subject}
                                </p>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-10 text-slate-400">
                        <i data-lucide="calendar" class="w-10 h-10 mb-2 opacity-50"></i>
                        <p class="text-sm font-medium">오늘은 일정이 없습니다. 휴식! 🏖️</p>
                    </div>
                `;
            }
        };

        const renderWeekly = () => {
            const todayStr = getCurrentDayString();
            const filtered = state.schedules.filter(s => {
                const matchView = state.viewMode === '통합' || s.child === state.viewMode;
                const matchSearch = s.title.includes(state.searchTerm) || s.subject.includes(state.searchTerm);
                return matchView && matchSearch;
            });

            const container = document.getElementById('weekly-grid');
            container.innerHTML = DAYS.map(day => {
                const daySchedules = filtered
                    .filter(s => s.day === day)
                    .sort((a, b) => a.startTime.localeCompare(b.startTime));
                
                const isToday = day === todayStr;
                const wrapperClass = isToday 
                    ? 'ring-4 ring-indigo-500/20 shadow-lg scale-[1.02] bg-white dark:bg-indigo-900/30' 
                    : 'bg-white shadow-sm dark:bg-slate-800';
                
                const headerClass = isToday
                    ? 'border-indigo-100 bg-indigo-50/50 dark:border-indigo-900/50 dark:bg-indigo-900/50'
                    : 'border-slate-50 dark:border-slate-700';

                const titleClass = isToday ? 'text-indigo-600 dark:text-indigo-400' : '';

                const itemsHtml = daySchedules.map(schedule => {
                    const itemBg = schedule.color === 'pink'
                        ? 'bg-pink-50 border-pink-200 dark:bg-pink-900/30 dark:border-pink-800/50'
                        : 'bg-blue-50 border-blue-200 dark:bg-blue-900/30 dark:border-blue-800/50';
                    const timeColor = schedule.color === 'pink' ? 'text-pink-500 dark:text-pink-400' : 'text-blue-500 dark:text-blue-400';
                    const dotClass = schedule.color === 'pink' ? 'bg-pink-400' : 'bg-blue-400';

                    return `
                        <div class="p-3.5 rounded-2xl border-2 flex flex-col gap-1 hover:-translate-y-1 transition-transform cursor-default shadow-sm ${itemBg}">
                            <div class="flex justify-between items-start mb-1">
                                <span class="text-xs font-black tracking-tight ${timeColor}">
                                    ${schedule.startTime} <span class="text-slate-300 dark:text-slate-600 mx-0.5">-</span> ${schedule.endTime}
                                </span>
                                ${state.viewMode === '통합' ? `<div class="w-2 h-2 rounded-full ${dotClass}"></div>` : ''}
                            </div>
                            <h4 class="text-base sm:text-lg font-black leading-tight">${schedule.title}</h4>
                            <p class="text-xs font-bold mt-1 flex items-center gap-1 text-slate-500 dark:text-slate-400">
                                <span class="text-[10px] opacity-70">📐</span> ${schedule.subject}
                            </p>
                        </div>
                    `;
                }).join('');

                const emptyHtml = daySchedules.length === 0 ? `
                    <div class="h-full min-h-[100px] flex items-center justify-center">
                        <div class="w-8 h-1 rounded-full bg-slate-100 dark:bg-slate-700"></div>
                    </div>
                ` : '';

                return `
                    <div class="flex-1 min-w-[140px] flex flex-col rounded-3xl overflow-hidden transition-all duration-300 ${wrapperClass}">
                        <div class="p-4 text-center border-b ${headerClass}">
                            <div class="flex items-center justify-center gap-2">
                                <h3 class="text-lg sm:text-xl font-black ${titleClass}">${day}</h3>
                                ${isToday ? '<span class="bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold animate-pulse">오늘</span>' : ''}
                            </div>
                            <span class="text-xs font-semibold text-slate-400 mt-1 inline-block bg-slate-100 dark:bg-slate-700 px-2 rounded-full">
                                ${daySchedules.length}개
                            </span>
                        </div>
                        <div class="p-3 flex flex-col gap-3 overflow-y-auto">
                            ${itemsHtml}
                            ${emptyHtml}
                        </div>
                    </div>
                `;
            }).join('');
        };

        const renderFilters = () => {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                const view = btn.dataset.view;
                if (state.viewMode === view) {
                    btn.className = "filter-btn flex items-center gap-2 px-4 sm:px-6 py-2.5 rounded-lg text-sm sm:text-base font-bold transition-all whitespace-nowrap bg-white text-indigo-600 shadow-sm dark:bg-slate-800 dark:text-indigo-400";
                } else {
                    btn.className = "filter-btn flex items-center gap-2 px-4 sm:px-6 py-2.5 rounded-lg text-sm sm:text-base font-bold transition-all whitespace-nowrap text-slate-500 hover:bg-slate-200 dark:text-slate-400 dark:hover:bg-slate-600";
                }
            });
        };

        const renderApp = () => {
            renderHeaderAuthButton();
            renderMarquee();
            renderFilters();
            renderToday();
            renderWeekly();
            lucide.createIcons(); // DOM 갱신 후 아이콘 재생성
        };

        // --- 구글 시트 데이터 동기화 (개선된 JSON 방식) ---
        const fetchSheetData = async () => {
            if (state.isSyncing) return;
            state.isSyncing = true;
            document.getElementById('sync-status').textContent = '데이터 불러오는 중...';
            document.querySelector('.sync-icon').classList.add('animate-spin');
            
            try {
                // 1. 설정 탭 로드
                try {
                    const settingsTable = await fetchJsonFromGviz(URL_PREFIX + encodeURIComponent('설정'));
                    if (settingsTable && settingsTable.rows && settingsTable.rows.length > 0) {
                        // 헤더가 있는 경우를 대비해 첫 번째 데이터 행을 가져옴
                        const row = settingsTable.rows[0]; 
                        const getCell = (colIdx) => {
                            if (!row.c || !row.c[colIdx]) return '';
                            const cell = row.c[colIdx];
                            if (cell.f !== undefined && cell.f !== null) return cell.f.toString().trim();
                            if (cell.v === null || cell.v === undefined) return '';
                            return cell.v.toString().trim();
                        };
                        
                        state.settings.password = getCell(0) || '1234'; // A2
                        state.settings.notice = getCell(1) || ''; // B2
                        if(!state.isEditMode) state.editNotice = state.settings.notice;
                    }
                } catch (e) {
                    console.warn("설정 탭을 읽어오는데 실패했습니다 (기본값 유지)", e);
                }

                // 2. 스케줄 탭 로드
                const processSheet = async (childName, color) => {
                    const table = await fetchJsonFromGviz(URL_PREFIX + encodeURIComponent(childName));
                    if (!table || !table.rows) return [];
                    
                    return table.rows.map((row, index) => {
                        // row.c 구조에서 안전하게 텍스트 값 추출 (포맷된 값 우선)
                        const getCell = (colIdx) => {
                            if (!row.c || !row.c[colIdx]) return '';
                            const cell = row.c[colIdx];
                            
                            // 구글 시트에 보이는 포맷팅된 문자열(f) 우선 사용
                            if (cell.f !== undefined && cell.f !== null) {
                                return cell.f.toString().trim();
                            }
                            
                            // 원본 데이터(v) 사용
                            if (cell.v === null || cell.v === undefined) return '';
                            let val = cell.v.toString().trim();
                            
                            // 구글 시트의 내부 Date 포맷을 시:분 형태로 자동 보정
                            if (val.startsWith('Date(')) {
                                const match = val.match(/Date\((\d+),\s*(\d+),\s*(\d+),\s*(\d+),\s*(\d+),\s*(\d+)\)/);
                                if (match) {
                                    const h = match[4].padStart(2, '0');
                                    const m = match[5].padStart(2, '0');
                                    return `${h}:${m}`;
                                }
                            }
                            return val;
                        };

                        const rawDay = getCell(0);
                        const day = normalizeDay(rawDay); // 요일 자동 인식

                        if (!day) return null; // 요일 정보가 없으면 무시

                        return {
                            id: `${childName}-${index}`, 
                            child: childName, 
                            color: color,
                            day: day, 
                            startTime: getCell(1) || '00:00', 
                            endTime: getCell(2) || '00:00', 
                            title: getCell(3) || '일정', 
                            subject: getCell(4) || ''
                        };
                    }).filter(item => item !== null);
                };

                const [nayoonData, taeyoonData] = await Promise.allSettled([
                    processSheet('나윤', 'pink'),
                    processSheet('태윤', 'blue')
                ]);

                let newSchedules = [];
                if (nayoonData.status === 'fulfilled') newSchedules.push(...nayoonData.value);
                if (taeyoonData.status === 'fulfilled') newSchedules.push(...taeyoonData.value);

                if (newSchedules.length > 0) {
                    state.schedules = newSchedules;
                    document.getElementById('sync-status').textContent = '동기화 완료';
                } else {
                    document.getElementById('sync-status').textContent = '데이터가 비어있습니다.';
                }

            } catch (error) {
                console.warn("구글 시트 연동 에러:", error);
                document.getElementById('sync-status').textContent = '에러: 시트 주소 또는 형식을 확인하세요.';
                // 실패 시 초기 모의데이터로 롤백 적용
                if(state.schedules.length === 0){
                     state.schedules = INITIAL_MOCK_DATA;
                }
            } finally {
                state.isSyncing = false;
                document.querySelector('.sync-icon').classList.remove('animate-spin');
                renderApp();
                setTimeout(() => {
                   if(document.getElementById('sync-status').textContent === '동기화 완료'){
                       document.getElementById('sync-status').textContent = '';
                   }
                }, 3000);
            }
        };

        // --- 초기화 및 이벤트 리스너 ---
        const init = () => {
            // 시계 타이머
            const updateClock = () => {
                const now = new Date();
                const daysStr = ['일', '월', '화', '수', '목', '금', '토'];
                document.getElementById('clock-date').textContent = 
                    `${now.getFullYear()}년 ${String(now.getMonth() + 1).padStart(2, '0')}월 ${String(now.getDate()).padStart(2, '0')}일 (${daysStr[now.getDay()]})`;
                document.getElementById('clock-hm').textContent = 
                    `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                document.getElementById('clock-s').textContent = `:${String(now.getSeconds()).padStart(2, '0')}`;
            };
            setInterval(updateClock, 1000);
            updateClock();

            // 이벤트 바인딩
            document.getElementById('btn-sync').addEventListener('click', fetchSheetData);
            
            document.getElementById('btn-darkmode').addEventListener('click', () => {
                state.isDarkMode = !state.isDarkMode;
                if (state.isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.viewMode = e.currentTarget.dataset.view;
                    renderApp();
                });
            });

            document.getElementById('search-input').addEventListener('input', (e) => {
                state.searchTerm = e.target.value;
                renderWeekly(); // 검색은 주간만 리렌더링
            });

            // 모달 처리
            const modal = document.getElementById('auth-modal');
            document.getElementById('close-modal').addEventListener('click', () => modal.classList.add('hidden'));
            document.getElementById('auth-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const pwd = document.getElementById('password-input').value;
                if (pwd === state.settings.password) {
                    state.isEditMode = true;
                    state.editNotice = state.settings.notice;
                    modal.classList.add('hidden');
                    document.getElementById('password-input').value = '';
                    renderApp();
                } else {
                    alert('비밀번호가 일치하지 않습니다.');
                }
            });

            // 첫 데이터 로드
            fetchSheetData();
        };

        // 앱 시작
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
